<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARS.md Compiler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fira+Sans:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title">ARS<span class="app-header__dot">.</span>md</h1>
      <p class="app-header__subtitle">Assessment Review Specification — compiler</p>
    </div>
  </header>

  <div class="app-shell">

    <aside class="sidebar" aria-label="Section navigation">
      <p class="sidebar__heading">Sections <span id="sidebar-progress-pct" class="sidebar__heading-pct">0%</span></p>
      <nav class="sidebar__nav" id="sidebar-nav">
        <!-- Filled by JS from sections.js -->
      </nav>
      <div class="sidebar__footer">
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress-bar__fill" id="progress-fill"></div>
        </div>
        <p class="sidebar__progress-text" id="progress-text">0 of 0 sections complete</p>
        <button class="btn btn--accent btn--full" id="btn-compile" type="button" disabled>
          Compile ARS.md
        </button>
        <button class="btn btn--danger" id="btn-reset" type="button">
          Reset Form
        </button>
      </div>
    </aside>

    <main class="workspace" id="workspace">

      <div class="wizard" id="wizard">
        <!-- Section forms rendered here by JS -->
      </div>

      <div class="wizard-nav">
        <button class="btn btn--ghost" id="btn-prev" type="button">← Previous</button>
        <span class="wizard-nav__counter" id="nav-counter">Section 1 of N</span>
        <button class="btn btn--primary" id="btn-next" type="button">Next →</button>
      </div>

    </main>

  </div>

  <div class="modal" id="output-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="output-modal-title">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel">
      <header class="modal__header">
        <h2 class="modal__title" id="output-modal-title">Compiled ARS.md</h2>
        <button class="modal__close" data-close-modal aria-label="Close">×</button>
      </header>
      <div class="modal__body">
        <div class="output-checklist" id="output-checklist">
          <!-- Rendered by JS on compile -->
        </div>
        <pre class="output-preview" id="output-preview"><code></code></pre>
      </div>
      <footer class="modal__footer">
        <button class="btn btn--ghost" id="btn-print" type="button">Print / Save PDF</button>
        <button class="btn btn--ghost" id="btn-copy" type="button">Copy ARS.md</button>
        <button class="btn btn--primary" id="btn-download" type="button">Download ARS.md</button>
      </footer>
    </div>
  </div>

  <footer>
    <p>ARS.md Compiler — Static tool. No data is saved to a server. All drafts are stored locally in your browser.</p>
    <p>Developed for institutional use. <a href="https://github.com/jesselsookha/ARS" style="color: var(--interactive); text-decoration: underline;">View Source</a></p>
  </footer>
  <script src="js/sections.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/compile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
